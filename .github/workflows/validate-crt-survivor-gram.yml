name: Validate complete CRT survivor Gram

on:
  push:
    branches:
      - gpt56/fortune-mesoscopic-cotlar-20260728
    paths:
      - "frontier/integer_source_frame_bridge/crt_survivor_gram_verify.py"
      - "frontier/integer_source_frame_bridge/crt_survivor_gram_results.json"
      - "frontier/integer_source_frame_bridge/COMPLETE_CRT_SURVIVOR_GRAM_AND_SAMPLING_BOUNDARY_20260729.md"
      - ".github/workflows/validate-crt-survivor-gram.yml"
  pull_request:
    paths:
      - "frontier/integer_source_frame_bridge/crt_survivor_gram_verify.py"
      - "frontier/integer_source_frame_bridge/crt_survivor_gram_results.json"
      - "frontier/integer_source_frame_bridge/COMPLETE_CRT_SURVIVOR_GRAM_AND_SAMPLING_BOUNDARY_20260729.md"
      - ".github/workflows/validate-crt-survivor-gram.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check sympy

      - name: Run exact verifier
        run: python frontier/integer_source_frame_bridge/crt_survivor_gram_verify.py

      - name: Require frozen result match
        run: git diff --exit-code -- frontier/integer_source_frame_bridge/crt_survivor_gram_results.json
