# Canonical Paper I release trigger: 24 July 2026
name: Build Paper I canonical release

on:
  pull_request:
    branches:
      - gpt56/d1-gate-bridge-terminal-20260724
    paths:
      - .github/workflows/build-paper1-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 401dff3b96525cdef6bd1b54d18f4450e5785ac8
          fetch-depth: 0

      - name: Install fixed document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            poppler-utils zip unzip python3-docx libreoffice-writer

      - name: Fetch audit records and live Zenodo archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt56/paper1-final-audit-20260724
          mkdir -p /tmp/paper1_zenodo
          curl -L --fail --retry 3 \
            'https://zenodo.org/api/records/21426465/files/consecutive_prime_partial_products_cold_review_reproducible.zip/content' \
            -o /tmp/paper1_zenodo/consecutive_prime_partial_products_cold_review_reproducible.zip
          curl -L --fail --retry 3 \
            'https://zenodo.org/api/records/21426465/files/consecutive_prime_partial_products_cold_review_reproducible.zip.sha256/content' \
            -o /tmp/paper1_zenodo/consecutive_prime_partial_products_cold_review_reproducible.zip.sha256
          test "$(sha256sum /tmp/paper1_zenodo/consecutive_prime_partial_products_cold_review_reproducible.zip | awk '{print $1}')" = \
            '651b17c92371b73eae5f224fdea78f85c6ea82bb94da6514d2b482a6b441a166'
          unzip -q /tmp/paper1_zenodo/consecutive_prime_partial_products_cold_review_reproducible.zip -d /tmp/paper1_zenodo/unpacked
          cd /tmp/paper1_zenodo/unpacked/consecutive_prime_partial_products_cold_review_reproducible
          python scripts/verify_manifest.py

      - name: Verify immutable reviewed source
        shell: bash
        run: |
          set -euo pipefail
          F='publications/fortune-papers-ii-vi-20260724/paper1_collision_geometry/manuscript.md'
          test "$(sha256sum "$F" | awk '{print $1}')" = '0e0f8a0d89209b8f4dd8c589526a89d57bd536f4889fdcd9c902a09b1a62f157'
          test "$(wc -l < "$F")" -ge 1900
          grep -Fq '## HTE4 (open)' "$F"
          grep -Fq '## HWF4 (open)' "$F"
          grep -Fq "No implication for Fortune's conjecture is claimed" "$F"
          grep -Fq '## 11.2. AI-assistance disclosure' "$F"
          ! grep -nE 'TODO|TBD|PLACEHOLDER|\\x00' "$F"

      - name: Build PDF and editable DOCX
        shell: bash
        run: |
          set -euo pipefail
          SRC='publications/fortune-papers-ii-vi-20260724/paper1_collision_geometry/manuscript.md'
          DIST='publications/fortune-papers-ii-vi-20260724/paper1-dist'
          RELEASE="$DIST/Paper_I_Hardened_Release"
          rm -rf "$DIST"
          mkdir -p "$RELEASE/audit" "$RELEASE/original_zenodo_archive" "$DIST/Zenodo_v2_Upload"
          cp "$SRC" "$RELEASE/manuscript.md"

          cat > /tmp/paper1-header.tex <<'EOF'
          \usepackage{xurl}
          \urlstyle{same}
          EOF

          pandoc "$SRC" \
            --from=markdown+tex_math_dollars+tex_math_single_backslash+raw_tex \
            --standalone --pdf-engine=xelatex \
            --include-in-header=/tmp/paper1-header.tex \
            -V geometry:margin=24mm -V papersize:a4 \
            -o "$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.pdf" \
            2> "$RELEASE/xelatex_warnings.log"

          pandoc "$SRC" \
            --from=markdown+tex_math_dollars+tex_math_single_backslash+raw_tex \
            --to=docx --standalone \
            -o "$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.docx"

          python3 - <<'PY'
          from docx import Document
          from docx.shared import Mm, Pt
          path='publications/fortune-papers-ii-vi-20260724/paper1-dist/Paper_I_Hardened_Release/Paper_I_Collision_Geometry_and_Spectral_Laws.docx'
          doc=Document(path)
          for sec in doc.sections:
              sec.page_width=Mm(210); sec.page_height=Mm(297)
              sec.top_margin=Mm(23); sec.bottom_margin=Mm(23)
              sec.left_margin=Mm(24); sec.right_margin=Mm(24)
          doc.styles['Normal'].font.size=Pt(10.5)
          doc.save(path)
          PY

          test -s "$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.pdf"
          test -s "$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.docx"
          if grep -Eiq 'Missing character|not available in font' "$RELEASE/xelatex_warnings.log"; then
            cat "$RELEASE/xelatex_warnings.log"
            exit 1
          fi

      - name: Add complete audit record
        shell: bash
        run: |
          set -euo pipefail
          DIST='publications/fortune-papers-ii-vi-20260724/paper1-dist'
          RELEASE="$DIST/Paper_I_Hardened_Release"
          REF='origin/gpt56/paper1-final-audit-20260724'
          BASE='fortune-conjecture/paper1-final-audit-20260724'
          for f in \
            FIDELITY_MATRIX.md \
            INDEPENDENT_CHECKS.md \
            FRESH_HOSTILE_REVIEW_QWEN3_14B_AWQ.md \
            HOSTILE_REVIEW_DISPOSITION.md \
            AUDIT_REPORT.md \
            FIDELITY_AND_EXTERNAL_REVIEW_GATES.md \
            ZENODO_NEW_VERSION_METADATA.md
          do
            git show "$REF:$BASE/$f" > "$RELEASE/audit/$f"
          done
          cp /tmp/paper1_zenodo/consecutive_prime_partial_products_cold_review_reproducible.zip \
            "$RELEASE/original_zenodo_archive/"
          cp /tmp/paper1_zenodo/consecutive_prime_partial_products_cold_review_reproducible.zip.sha256 \
            "$RELEASE/original_zenodo_archive/"
          printf '%s  %s\n' \
            '651b17c92371b73eae5f224fdea78f85c6ea82bb94da6514d2b482a6b441a166' \
            'consecutive_prime_partial_products_cold_review_reproducible.zip' \
            > "$RELEASE/original_zenodo_archive/ZENODO_ARCHIVE_SHA256.txt"

      - name: Automated PDF and DOCX quality gates
        shell: bash
        run: |
          set -euo pipefail
          DIST='publications/fortune-papers-ii-vi-20260724/paper1-dist'
          RELEASE="$DIST/Paper_I_Hardened_Release"
          PDF="$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.pdf"
          DOCX="$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.docx"

          pdfinfo "$PDF" > "$RELEASE/pdfinfo.txt"
          pdffonts "$PDF" > "$RELEASE/pdffonts.txt"
          pdftotext -layout "$PDF" "$RELEASE/pdf_extracted.txt"
          pandoc "$DOCX" -t plain -o "$RELEASE/docx_extracted.txt"
          grep -Fq '(A4)' "$RELEASE/pdfinfo.txt"
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" -ge 25
          awk 'NR>2 && ($6!="yes" || $7!="yes") {bad=1} END {exit bad}' "$RELEASE/pdffonts.txt"

          python3 - <<'PY'
          from pathlib import Path
          from docx import Document
          import re, unicodedata, zipfile
          root=Path('publications/fortune-papers-ii-vi-20260724/paper1-dist/Paper_I_Hardened_Release')
          markers=[
            ('exact','fourth','moment'),
            ('averaged','low','transport'),
            ('smith','form'),
            ('median','bilinear'),
            ('non','gaussian','spectral'),
            ('hte4','open'),
            ('hwf4','open'),
            ('fortune','conjecture','claimed'),
            ('ai','assistance','disclosure'),
          ]
          for name in ['pdf_extracted.txt','docx_extracted.txt']:
              s=(root/name).read_text(encoding='utf-8',errors='replace')
              n=' '.join(re.sub(r'[^a-z0-9]+',' ',unicodedata.normalize('NFKD',s).lower()).split())
              assert len(n)>25000,(name,len(n))
              for words in markers:
                  assert all(w in n for w in words),(name,words)
          doc=Document(root/'Paper_I_Collision_Geometry_and_Spectral_Laws.docx')
          headings=[]
          for p in doc.paragraphs:
              if p.style and p.style.name.startswith('Heading'):
                  headings.append((p.style.name,p.text.strip()))
          assert len(headings)>=50,len(headings)
          assert any('Remaining problems' in t for _,t in headings)
          assert any('AI-assistance disclosure' in t for _,t in headings)
          with zipfile.ZipFile(root/'Paper_I_Collision_Geometry_and_Spectral_Laws.docx') as z:
              xml=z.read('word/document.xml')
              assert b'<m:oMath' in xml or b'<m:oMathPara' in xml
          (root/'docx_heading_report.txt').write_text('\n'.join(f'{s}: {t}' for s,t in headings),encoding='utf-8')
          PY

          mkdir -p "$DIST/docx_render"
          libreoffice --headless --convert-to pdf --outdir "$DIST/docx_render" "$DOCX" >/tmp/lo.log 2>&1
          DOCXPDF="$DIST/docx_render/Paper_I_Collision_Geometry_and_Spectral_Laws.pdf"
          test -s "$DOCXPDF"
          test "$(pdfinfo "$DOCXPDF" | awk '/^Pages:/ {print $2}')" -ge 25
          cp "$DOCXPDF" "$RELEASE/Paper_I_DOCX_render_for_QA.pdf"

      - name: Create release and Zenodo-new-version packages
        shell: bash
        run: |
          set -euo pipefail
          DIST='publications/fortune-papers-ii-vi-20260724/paper1-dist'
          RELEASE="$DIST/Paper_I_Hardened_Release"
          ZENODO="$DIST/Zenodo_v2_Upload"

          cat > "$RELEASE/TYPESETTING_AND_RELEASE_NOTES.md" <<'EOF'
          # Typesetting and release notes

          The PDF is generated directly from the exact reviewed Markdown with Pandoc and XeLaTeX. `xurl` is loaded solely to allow visible DOI/URL strings to wrap safely. The DOCX contains editable Office Math equations and A4 page geometry. No mathematical statement, hypothesis, exponent, constant or symbol is changed by the build.

          The file `Paper_I_DOCX_render_for_QA.pdf` is included only as a visual-QA rendering of the editable DOCX and is not a publication manuscript.
          EOF

          (cd "$RELEASE" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$DIST" && zip -r -9 Paper_I_Hardened_Release.zip Paper_I_Hardened_Release >/dev/null)

          cp "$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.pdf" "$ZENODO/"
          cp "$RELEASE/Paper_I_Collision_Geometry_and_Spectral_Laws.docx" "$ZENODO/"
          cp "$RELEASE/manuscript.md" "$ZENODO/"
          cp "$RELEASE/audit/AUDIT_REPORT.md" "$ZENODO/Paper_I_AUDIT_REPORT.md"
          cp "$RELEASE/audit/ZENODO_NEW_VERSION_METADATA.md" "$ZENODO/"
          cp "$RELEASE/original_zenodo_archive/consecutive_prime_partial_products_cold_review_reproducible.zip" "$ZENODO/"
          cp "$RELEASE/original_zenodo_archive/consecutive_prime_partial_products_cold_review_reproducible.zip.sha256" "$ZENODO/"
          cp "$DIST/Paper_I_Hardened_Release.zip" "$ZENODO/"
          (cd "$ZENODO" && find . -type f ! -name Paper_I_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > Paper_I_SHA256SUMS.txt)
          (cd "$DIST" && zip -r -9 Paper_I_Zenodo_New_Version_Package.zip Zenodo_v2_Upload >/dev/null)
          (cd "$DIST" && sha256sum Paper_I_Hardened_Release.zip Paper_I_Zenodo_New_Version_Package.zip > RELEASE_ZIP_SHA256SUMS.txt)

      - name: Upload canonical release artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper1-canonical-release
          path: publications/fortune-papers-ii-vi-20260724/paper1-dist/
          if-no-files-found: error
          retention-days: 30
