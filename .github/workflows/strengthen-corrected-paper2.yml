name: Strengthen corrected Paper II proofs

on:
  pull_request:
    branches:
      - gpt56/fortune-mainterm-correction-programme-20260727
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt56/fortune-mainterm-correction-programme-20260727
          fetch-depth: 0
      - name: Apply exact targeted repairs
        run: python3 scripts/strengthen_corrected_paper2_proofs.py
      - name: Validate amended route and proofs
        run: |
          set -euo pipefail
          P=publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          grep -Fq 'Two corrected transference routes remain open' "$P"
          grep -Fq 'Expanded Fourier-sign verification' "$P"
          grep -Fq 'Expanded coprimality and prime-power details' "$P"
          grep -Fq 'Route A starts' "$P"
          ! grep -nE 'TODO|TBD|PLACEHOLDER' "$P"
          sha256sum "$P"
      - name: Commit amendment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          git commit -m 'Strengthen corrected Paper II proofs and refine live routes' || exit 0
          git push origin HEAD:gpt56/fortune-mainterm-correction-programme-20260727
