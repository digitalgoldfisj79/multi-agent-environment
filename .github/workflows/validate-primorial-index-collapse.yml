name: Validate primorial-index collapse

on:
  pull_request:
    branches: [publication/fortune-papers-ii-vi-20260724]
    paths:
      - .github/workflows/validate-primorial-index-collapse.yml
      - frontier/integer_source_frame_bridge/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check theorem package
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          for file in \
            PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md \
            LARGEST_FACTOR_ROUTED_BESSEL_INEQUALITY_20260728.md \
            LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md \
            ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md \
            THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md \
            EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md \
            VAUGHAN_QUOTIENT_COEFFICIENT_COLLAPSE_20260728.md \
            EXACT_NONZERO_MODE_VAUGHAN_IDENTITY_20260728.md \
            primorial_shrinking_target_verify.py \
            largest_factor_hyperbola_verify.py \
            orbit_routed_vaughan_verify.py \
            three_orbit_column_verify.py \
            zero_frequency_principal_verify.py \
            vaughan_quotient_coefficient_verify.py \
            exact_nonzero_mode_verify.py; do
            test -s "$ROOT/$file"
          done
          ! grep -RInE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' \
            "$ROOT"/*_20260728.md
          grep -Fq 'Theorem 4.1 (shrinking-target separation)' \
            "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 5.1 (three-orbit-column identity)' \
            "$ROOT/THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md"
          grep -Fq 'Theorem 3.1 (uniform positive baseline)' \
            "$ROOT/EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md"
          grep -Fq 'Theorem 4.1 (nonzero-mode source identity)' \
            "$ROOT/EXACT_NONZERO_MODE_VAUGHAN_IDENTITY_20260728.md"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check sympy

      - name: Recompute all exact identities
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          python "$ROOT/primorial_shrinking_target_verify.py" > /tmp/shrinking.json
          python "$ROOT/largest_factor_hyperbola_verify.py" > /tmp/hyperbola.json
          python "$ROOT/orbit_routed_vaughan_verify.py" > /tmp/vaughan.json
          python "$ROOT/three_orbit_column_verify.py" > /tmp/columns.json
          python "$ROOT/zero_frequency_principal_verify.py" > /tmp/zero.json
          python "$ROOT/vaughan_quotient_coefficient_verify.py" > /tmp/coefficients.json
          python "$ROOT/exact_nonzero_mode_verify.py" > /tmp/nonzero.json

      - name: Check validation boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontier/integer_source_frame_bridge')

          shrinking = json.loads((root/'primorial_shrinking_target_results.json').read_text())
          assert shrinking['status'] == 'PASS'
          assert sum(r['verified_visit_pairs'] for r in shrinking['exhaustive_rows']) > 60_000

          hyperbola = json.loads((root/'largest_factor_hyperbola_results.json').read_text())
          assert hyperbola['status'] == 'PASS'
          assert hyperbola['universal_max_error'] < 2e-12

          vaughan = json.loads((root/'orbit_routed_vaughan_results.json').read_text())
          assert vaughan['status'] == 'PASS'
          assert vaughan['universal']['cases'] == 4 * 1999
          assert vaughan['universal']['max_error'] < 5e-11
          assert vaughan['shifted_block']['Y_exceeds_H']
          assert vaughan['shifted_block']['all_recorded_minima_exceed_H']
          assert vaughan['routed_columns']['maximum_support_to_theorem_bound_ratio'] <= 1

          columns = json.loads((root/'three_orbit_column_results.json').read_text())
          assert columns['status'] == 'PASS'
          assert columns['source']['max_source_error'] < 2e-9
          assert columns['completion']['max_error'] < 3e-9

          zero = json.loads((root/'zero_frequency_principal_results.json').read_text())
          assert zero['status'] == 'PASS'
          assert all(row['Y_exceeds_H'] for row in zero['primorial_panel'])
          assert max(row['combined_error'] for row in zero['toy_exact_rows']) < 5e-12

          coefficients = json.loads((root/'vaughan_quotient_coefficient_results.json').read_text())
          assert coefficients['status'] == 'PASS'
          assert coefficients['max_identity_error'] < 2e-11
          assert coefficients['support_errors'] == 0

          nonzero = json.loads((root/'exact_nonzero_mode_results.json').read_text())
          assert nonzero['status'] == 'PASS'
          assert max(row['source_error'] for row in nonzero['rows']) < 2e-10
          assert max(row['projector_error'] for row in nonzero['rows']) < 2e-10
          assert max(row['log_projector_error'] for row in nonzero['rows']) < 2e-10
          print('all primorial-index collapse gates passed')
          PY

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: primorial-index-collapse-validation
          path: |
            /tmp/*.json
            frontier/integer_source_frame_bridge/*_results.json
            frontier/integer_source_frame_bridge/*_20260728.md
          retention-days: 90
