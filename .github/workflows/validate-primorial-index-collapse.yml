name: Validate primorial-index collapse

on:
  pull_request:
    branches: [publication/fortune-papers-ii-vi-20260724]
    paths:
      - .github/workflows/validate-primorial-index-collapse.yml
      - frontier/integer_source_frame_bridge/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check theorem package
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          for file in \
            PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md \
            LARGEST_FACTOR_ROUTED_BESSEL_INEQUALITY_20260728.md \
            LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md \
            ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md \
            THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md \
            EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md \
            VAUGHAN_QUOTIENT_COEFFICIENT_COLLAPSE_20260728.md \
            EXACT_NONZERO_MODE_VAUGHAN_IDENTITY_20260728.md \
            MOBIUS_LOG_SINGLE_COLUMN_COLLAPSE_20260728.md; do
            test -s "$ROOT/$file"
          done
          ! grep -RInE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' "$ROOT"/*_20260728.md
          grep -Fq 'Theorem 4.1 (shrinking-target separation)' "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 3.1 (uniform positive baseline)' "$ROOT/EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md"
          grep -Fq 'Theorem 5.1 (single-column nonzero identity)' "$ROOT/MOBIUS_LOG_SINGLE_COLUMN_COLLAPSE_20260728.md"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check sympy

      - name: Verify shrinking target
        run: python frontier/integer_source_frame_bridge/primorial_shrinking_target_verify.py > /tmp/shrinking.json

      - name: Verify largest-factor hyperbola
        run: python frontier/integer_source_frame_bridge/largest_factor_hyperbola_verify.py > /tmp/hyperbola.json

      - name: Verify orbit-routed Vaughan
        run: python frontier/integer_source_frame_bridge/orbit_routed_vaughan_verify.py > /tmp/vaughan.json

      - name: Verify three orbit columns
        run: python frontier/integer_source_frame_bridge/three_orbit_column_verify.py > /tmp/columns.json

      - name: Verify zero-frequency principal term
        run: python frontier/integer_source_frame_bridge/zero_frequency_principal_verify.py > /tmp/zero.json

      - name: Verify quotient coefficients
        run: python frontier/integer_source_frame_bridge/vaughan_quotient_coefficient_verify.py > /tmp/coefficients.json

      - name: Verify exact nonzero modes
        run: python frontier/integer_source_frame_bridge/exact_nonzero_mode_verify.py > /tmp/nonzero.json

      - name: Verify Möbius-log single column
        run: python frontier/integer_source_frame_bridge/mobius_log_single_column_verify.py > /tmp/mobius-log.json

      - name: Check validation boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('frontier/integer_source_frame_bridge')
          names=('primorial_shrinking_target','largest_factor_hyperbola','orbit_routed_vaughan','three_orbit_column','zero_frequency_principal','vaughan_quotient_coefficient','exact_nonzero_mode','mobius_log_single_column')
          data={n:json.loads((root/f'{n}_results.json').read_text()) for n in names}
          assert all(v['status']=='PASS' for v in data.values())
          assert data['orbit_routed_vaughan']['universal']['cases']==4*1999
          assert data['orbit_routed_vaughan']['shifted_block']['Y_exceeds_H']
          assert data['orbit_routed_vaughan']['shifted_block']['all_recorded_minima_exceed_H']
          assert data['three_orbit_column']['source']['max_source_error']<2e-9
          assert data['zero_frequency_principal']['primorial_panel'][0]['Y_exceeds_H']
          assert data['vaughan_quotient_coefficient']['support_errors']==0
          assert max(r['source_error'] for r in data['exact_nonzero_mode']['rows'])<2e-10
          assert max(r['source_error'] for r in data['mobius_log_single_column']['rows'])<2e-10
          print('all primorial-index collapse gates passed')
          PY

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: primorial-index-collapse-validation
          path: |
            /tmp/*.json
            frontier/integer_source_frame_bridge/*_results.json
            frontier/integer_source_frame_bridge/*_20260728.md
          retention-days: 90
