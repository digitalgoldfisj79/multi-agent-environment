name: Validate primorial-index collapse

on:
  pull_request:
    branches:
      - publication/fortune-papers-ii-vi-20260724
    paths:
      - .github/workflows/validate-primorial-index-collapse.yml
      - frontier/integer_source_frame_bridge/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md
      - frontier/integer_source_frame_bridge/LARGEST_FACTOR_ROUTED_BESSEL_INEQUALITY_20260728.md
      - frontier/integer_source_frame_bridge/LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md
      - frontier/integer_source_frame_bridge/ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md
      - frontier/integer_source_frame_bridge/THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md
      - frontier/integer_source_frame_bridge/EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md
      - frontier/integer_source_frame_bridge/primorial_shrinking_target_verify.py
      - frontier/integer_source_frame_bridge/largest_factor_hyperbola_verify.py
      - frontier/integer_source_frame_bridge/orbit_routed_vaughan_verify.py
      - frontier/integer_source_frame_bridge/three_orbit_column_verify.py
      - frontier/integer_source_frame_bridge/zero_frequency_principal_verify.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check theorem package
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          for file in \
            PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md \
            LARGEST_FACTOR_ROUTED_BESSEL_INEQUALITY_20260728.md \
            LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md \
            ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md \
            THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md \
            EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md \
            primorial_shrinking_target_verify.py \
            largest_factor_hyperbola_verify.py \
            orbit_routed_vaughan_verify.py \
            three_orbit_column_verify.py \
            zero_frequency_principal_verify.py; do
            test -s "$ROOT/$file"
          done
          ! grep -RInE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' \
            "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md" \
            "$ROOT/LARGEST_FACTOR_ROUTED_BESSEL_INEQUALITY_20260728.md" \
            "$ROOT/LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md" \
            "$ROOT/ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md" \
            "$ROOT/THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md" \
            "$ROOT/EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md"
          grep -Fq 'Theorem 4.1 (shrinking-target separation)' \
            "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 2.1 (largest-factor hyperbola identity)' \
            "$ROOT/LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md"
          grep -Fq 'Theorem 1.1 (exact Vaughan identity)' \
            "$ROOT/ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 5.1 (fixed-complexity column sparsity)' \
            "$ROOT/ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 5.1 (three-orbit-column identity)' \
            "$ROOT/THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md"
          grep -Fq 'Theorem 5.1 (exact zero-frequency baseline)' \
            "$ROOT/EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md"
          grep -Fq "Fortune's conjecture" \
            "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check sympy

      - name: Recompute shrinking-target verification
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          python "$ROOT/primorial_shrinking_target_verify.py" > /tmp/shrinking-target.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontier/integer_source_frame_bridge')
          data = json.loads((root / 'primorial_shrinking_target_results.json').read_text())
          assert data['status'] == 'PASS'
          assert len(data['exhaustive_rows']) == 5
          assert sum(r['verified_visit_pairs'] for r in data['exhaustive_rows']) > 60_000
          for item in data['scale_summary']:
              assert item['first_scale']['sample_max_visits'] <= item['first_scale']['theorem_bound']
              assert item['last_scale']['sample_max_visits'] <= item['last_scale']['theorem_bound']
          x1009 = data['fixed_depth_tables'][-1]
          bounds = {row['R']: row['centre_multiplicity_bound'] for row in x1009['rows']}
          assert bounds[2] <= 3
          assert bounds[3] <= 4
          assert bounds[10] <= 13
          print(json.dumps(data, indent=2))
          PY

      - name: Recompute hyperbola verification
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          python "$ROOT/largest_factor_hyperbola_verify.py" > /tmp/hyperbola.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontier/integer_source_frame_bridge')
          data = json.loads((root / 'largest_factor_hyperbola_results.json').read_text())
          assert data['status'] == 'PASS'
          assert data['universal_max_error'] < 2e-12
          assert data['shifted_block']['shifted_max_error'] < 2e-11
          assert data['shifted_block']['all_routed_largest_factors_above_H']
          assert data['one_point_routing']['observed_max_column_support'] <= \
                 data['one_point_routing']['threshold_multiplicity_bound']
          print(json.dumps(data, indent=2))
          PY

      - name: Recompute orbit-routed Vaughan verification
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          python "$ROOT/orbit_routed_vaughan_verify.py" > /tmp/vaughan.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontier/integer_source_frame_bridge')
          data = json.loads((root / 'orbit_routed_vaughan_results.json').read_text())
          assert data['status'] == 'PASS'
          assert data['universal']['cases'] == 4 * 4999
          assert data['universal']['max_error'] < 5e-11
          assert data['shifted_block']['Y_exceeds_H']
          assert data['shifted_block']['all_minima_exceed_H']
          assert data['shifted_block']['max_error'] < 2e-9
          assert data['routed_columns']['maximum_support_to_theorem_bound_ratio'] <= 1
          print(json.dumps(data, indent=2))
          PY

      - name: Recompute three-orbit-column verification
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          python "$ROOT/three_orbit_column_verify.py" > /tmp/three-columns.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontier/integer_source_frame_bridge')
          data = json.loads((root / 'three_orbit_column_results.json').read_text())
          assert data['status'] == 'PASS'
          assert data['source']['max_source_error'] < 2e-8
          assert data['source']['max_type1_column_error'] < 2e-11
          assert data['source']['max_type2_column_error'] < 2e-11
          assert data['source']['max_type3_column_error'] < 2e-11
          assert data['completion']['max_error'] < 2e-9
          print(json.dumps(data, indent=2))
          PY

      - name: Recompute zero-frequency principal term
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          python "$ROOT/zero_frequency_principal_verify.py" > /tmp/zero-mode.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontier/integer_source_frame_bridge')
          data = json.loads((root / 'zero_frequency_principal_results.json').read_text())
          assert data['status'] == 'PASS'
          for row in data['toy_exact_rows']:
              assert row['type_I_error'] < 2e-12
              assert row['type_II_error'] < 2e-12
              assert row['type_III_error'] < 2e-12
              assert row['combined_error'] < 5e-12
          assert all(row['Y_exceeds_H'] for row in data['primorial_panel'])
          print(json.dumps(data, indent=2))
          PY

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: primorial-index-collapse-validation
          path: |
            /tmp/shrinking-target.stdout.json
            /tmp/hyperbola.stdout.json
            /tmp/vaughan.stdout.json
            /tmp/three-columns.stdout.json
            /tmp/zero-mode.stdout.json
            frontier/integer_source_frame_bridge/primorial_shrinking_target_results.json
            frontier/integer_source_frame_bridge/primorial_shrinking_target_results_full.json
            frontier/integer_source_frame_bridge/largest_factor_hyperbola_results.json
            frontier/integer_source_frame_bridge/orbit_routed_vaughan_results.json
            frontier/integer_source_frame_bridge/three_orbit_column_results.json
            frontier/integer_source_frame_bridge/zero_frequency_principal_results.json
            frontier/integer_source_frame_bridge/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md
            frontier/integer_source_frame_bridge/LARGEST_FACTOR_ROUTED_BESSEL_INEQUALITY_20260728.md
            frontier/integer_source_frame_bridge/LARGEST_FACTOR_HYPERBOLA_SOURCE_IDENTITY_20260728.md
            frontier/integer_source_frame_bridge/ORBIT_ROUTED_VAUGHAN_COLLAPSE_20260728.md
            frontier/integer_source_frame_bridge/THREE_ORBIT_COLUMN_SOURCE_IDENTITY_20260728.md
            frontier/integer_source_frame_bridge/EXPLICIT_ZERO_FREQUENCY_PRINCIPAL_TERM_20260728.md
          retention-days: 90
