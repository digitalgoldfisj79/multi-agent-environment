name: Validate primorial-index collapse

on:
  pull_request:
    branches: [publication/fortune-papers-ii-vi-20260724]
    paths:
      - .github/workflows/validate-primorial-index-collapse.yml
      - frontier/integer_source_frame_bridge/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check theorem package
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          for file in \
            PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md \
            MOBIUS_LOG_SINGLE_COLUMN_COLLAPSE_20260728.md \
            PRIME_OFFSET_ROUGH_MODULUS_COLLAPSE_20260728.md \
            SMALL_MODULUS_ONE_NEW_PRIME_COLLAPSE_20260728.md \
            SMOOTH_DIVISOR_LOG2_THEOREM_20260728.md; do
            test -s "$ROOT/$file"
          done
          ! grep -RInE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' \
            "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md" \
            "$ROOT/MOBIUS_LOG_SINGLE_COLUMN_COLLAPSE_20260728.md" \
            "$ROOT/PRIME_OFFSET_ROUGH_MODULUS_COLLAPSE_20260728.md" \
            "$ROOT/SMALL_MODULUS_ONE_NEW_PRIME_COLLAPSE_20260728.md" \
            "$ROOT/SMOOTH_DIVISOR_LOG2_THEOREM_20260728.md"
          grep -Fq 'Theorem 4.1 (shrinking-target separation)' "$ROOT/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 5.1 (single-column nonzero identity)' "$ROOT/MOBIUS_LOG_SINGLE_COLUMN_COLLAPSE_20260728.md"
          grep -Fq 'Theorem 5.1 (smooth-divisor asymptotic)' "$ROOT/SMOOTH_DIVISOR_LOG2_THEOREM_20260728.md"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check sympy

      - name: Verify shrinking target
        run: python frontier/integer_source_frame_bridge/primorial_shrinking_target_verify.py > /tmp/shrinking.json

      - name: Verify Möbius-log single column
        run: python frontier/integer_source_frame_bridge/mobius_log_single_column_verify.py > /tmp/mobius-log.json

      - name: Verify prime-offset rough moduli
        run: python frontier/integer_source_frame_bridge/prime_offset_rough_modulus_verify.py > /tmp/prime-rough.json

      - name: Verify one-new-prime small moduli
        run: python frontier/integer_source_frame_bridge/small_modulus_one_new_prime_verify.py > /tmp/one-new-prime.json

      - name: Verify smooth log-two sector
        run: python frontier/integer_source_frame_bridge/smooth_divisor_log2_verify.py > /tmp/log-two.json

      - name: Check validation boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('frontier/integer_source_frame_bridge')
          names=('primorial_shrinking_target','mobius_log_single_column','prime_offset_rough_modulus','small_modulus_one_new_prime','smooth_divisor_log2')
          data={n:json.loads((root/f'{n}_results.json').read_text()) for n in names}
          assert all(v['status']=='PASS' for v in data.values())
          assert max(r['source_error'] for r in data['mobius_log_single_column']['rows'])<2e-10
          assert max(r['split_error'] for r in data['prime_offset_rough_modulus']['rows'])<3e-10
          assert max(r['weighted_decomposition_error'] for r in data['small_modulus_one_new_prime']['rows'])<3e-10
          assert max(r['error'] for r in data['smooth_divisor_log2']['exact_rows'])<3e-10
          print('all load-bearing Möbius-log collapse gates passed')
          PY

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: primorial-index-collapse-validation
          path: |
            /tmp/*.json
            frontier/integer_source_frame_bridge/primorial_shrinking_target_results*.json
            frontier/integer_source_frame_bridge/mobius_log_single_column_results.json
            frontier/integer_source_frame_bridge/prime_offset_rough_modulus_results.json
            frontier/integer_source_frame_bridge/small_modulus_one_new_prime_results.json
            frontier/integer_source_frame_bridge/smooth_divisor_log2_results.json
            frontier/integer_source_frame_bridge/PRIMORIAL_INDEX_SHRINKING_TARGET_COLLAPSE_20260728.md
            frontier/integer_source_frame_bridge/MOBIUS_LOG_SINGLE_COLUMN_COLLAPSE_20260728.md
            frontier/integer_source_frame_bridge/PRIME_OFFSET_ROUGH_MODULUS_COLLAPSE_20260728.md
            frontier/integer_source_frame_bridge/SMALL_MODULUS_ONE_NEW_PRIME_COLLAPSE_20260728.md
            frontier/integer_source_frame_bridge/SMOOTH_DIVISOR_LOG2_THEOREM_20260728.md
          retention-days: 90
