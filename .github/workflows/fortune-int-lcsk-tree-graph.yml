name: Fortune INT-LCSK tree graph

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fortune-int-lcsk-tree-graph/**'
      - 'fortune-formal/FortuneFormal/Integer/LocalConnectedTreeObstruction.lean'
      - 'fortune-formal/FortuneFormal.lean'
      - '.github/workflows/fortune-int-lcsk-tree-graph.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static trust audit and exact regressions
        run: python fortune-int-lcsk-tree-graph/scripts/verify_programme.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.32.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate manifest and restore Mathlib cache
        working-directory: fortune-formal
        run: |
          elan toolchain install $(cat lean-toolchain)
          lean --version | grep -F 'version 4.32.0'
          lake update
          lake exe cache get
      - name: Targeted LCSK obstruction build
        working-directory: fortune-formal
        run: lake build FortuneFormal.Integer.LocalConnectedTreeObstruction
      - name: Full formal package build
        working-directory: fortune-formal
        run: lake build
      - name: New-file trust scan
        run: |
          ! grep -En '\b(sorry|admit|axiom|unsafe)\b' fortune-formal/FortuneFormal/Integer/LocalConnectedTreeObstruction.lean
