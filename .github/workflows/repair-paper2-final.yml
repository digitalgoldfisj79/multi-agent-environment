# Triggered 24 July 2026 — reciprocal weight
name: Repair Paper II reciprocal weight

on:
  pull_request:
    branches:
      - gpt56/d1-gate-bridge-terminal-20260724
    paths:
      - .github/workflows/repair-paper2-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0
      - name: Apply reciprocal-weight admissibility repair
        run: python3 scripts/repair_paper2_rho.py
      - name: Validate source
        run: |
          set -euo pipefail
          F=publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          grep -Fq '\inf_{1/2\le |t|\le1}\rho(t)>0' "$F"
          grep -Fq 'D_X\asymp_\rho|\mathcal Q_X|' "$F"
          sha256sum "$F"
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          git commit -m 'Add admissibility condition to Paper II reciprocal weight'
          git push origin HEAD:publication/fortune-papers-ii-vi-20260724
