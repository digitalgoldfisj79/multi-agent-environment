name: Repair Paper II final source

on:
  pull_request:
    branches:
      - gpt56/d1-gate-bridge-terminal-20260724
    paths:
      - .github/workflows/repair-paper2-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0
      - name: Apply deterministic source repairs
        run: python3 scripts/repair_paper2_final.py
      - name: Validate repaired source
        run: |
          set -euo pipefail
          F=publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          grep -Fq 'all quotient sums below are therefore over' "$F"
          grep -Fq 'Let \(L(X)\ge1\) satisfy \(L(X)=X^{o(1)}\)' "$F"
          grep -Fq 'This manuscript does not reprove the source-to-frame transference step' "$F"
          grep -Fq '\mathfrak S(m-n)\ge2C_2>0' "$F"
          sha256sum "$F"
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          git commit -m 'Repair final Paper II source and claim boundary'
          git push origin HEAD:publication/fortune-papers-ii-vi-20260724
