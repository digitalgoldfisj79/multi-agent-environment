name: Validate Ramanujan full-chaos levels

on:
  pull_request:
    paths:
      - 'frontier/integer_source_frame_bridge/ramanujan_full_chaos_verify.py'
      - 'frontier/integer_source_frame_bridge/ramanujan_full_chaos_results.json'
      - 'frontier/integer_source_frame_bridge/RAMANUJAN_PROJECTOR_AND_FULL_CHAOS_NEXT_LEVELS_20260729.md'
      - 'frontier/integer_source_frame_bridge/PROGRAMME_STATUS_AFTER_NEXT_TWO_LEVELS_20260729.md'
      - '.github/workflows/validate-ramanujan-full-chaos.yml'
  workflow_dispatch:

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Run exact and finite verifier
        run: |
          python frontier/integer_source_frame_bridge/ramanujan_full_chaos_verify.py > /tmp/ramanujan_full_chaos_output.json
          git diff --exit-code -- frontier/integer_source_frame_bridge/ramanujan_full_chaos_results.json
      - name: Check theorem and boundary markers
        run: |
          ROOT=frontier/integer_source_frame_bridge
          grep -Fq 'Theorem 2.1 — exact quotient roughness projector' "$ROOT/RAMANUJAN_PROJECTOR_AND_FULL_CHAOS_NEXT_LEVELS_20260729.md"
          grep -Fq 'Open theorem `JIRP(X)`' "$ROOT/RAMANUJAN_PROJECTOR_AND_FULL_CHAOS_NEXT_LEVELS_20260729.md"
          grep -Fq 'Open theorem `BMST(X)`' "$ROOT/RAMANUJAN_PROJECTOR_AND_FULL_CHAOS_NEXT_LEVELS_20260729.md"
          grep -Fq "Fortune's conjecture remains **OPEN**" "$ROOT/PROGRAMME_STATUS_AFTER_NEXT_TWO_LEVELS_20260729.md"
