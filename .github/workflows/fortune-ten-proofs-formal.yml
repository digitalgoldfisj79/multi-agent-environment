name: Validate Fortune formal discovery programme

"on":
  push:
    branches:
      - "gpt56/fortune-ten-proofs-formal-v01-20260804"
      - "publication/fortune-papers-ii-vi-20260724"
    paths:
      - "fortune-formal/**"
      - ".github/workflows/fortune-ten-proofs-formal.yml"
  pull_request:
    paths:
      - "fortune-formal/**"
      - ".github/workflows/fortune-ten-proofs-formal.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "fortune-formal-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify programme contract and trust boundary
        run: python3 fortune-formal/scripts/verify_programme.py

  lean-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fortune-formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Confirm pinned Lean version
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lean" --version | tee /tmp/lean-version.txt
          grep -F "version 4.32.0" /tmp/lean-version.txt
      - name: Fetch mathlib cache
        run: "$HOME/.elan/bin/lake" exe cache get
      - name: Build compiled specification
        run: "$HOME/.elan/bin/lake" build FortuneFormal
      - name: Re-run static trust audit
        run: python3 scripts/verify_programme.py
