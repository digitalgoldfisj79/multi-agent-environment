name: Formalize Paper IV pattern comparison

on:
  push:
    branches:
      - publication/fortune-papers-ii-vi-20260724
    paths:
      - .github/workflows/patch-paper4-pattern-bound.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0

      - name: Replace ratio of actual sums by ratio of upper bounds
        shell: python
        run: |
          from pathlib import Path
          p = Path("publications/fortune-papers-ii-vi-20260724/paper4_random_order/manuscript.md")
          s = p.read_text(encoding="utf-8")
          old = r'''**Proof.** Let \(P_0\) be the all-bad pattern and let \(P\) have \(f\ge1\)
          good vertices. Dividing (6.5) for \(P\) by its all-bad counterpart gives
          \[
          \frac{\Sigma(P)}{\Sigma(P_0)}
          \le C_*K^2X^{-30f}
          \prod_{v\text{ good}}
          \frac{\operatorname{L1}(e_v)}{\beta\operatorname{SUP}(e_v)}.
          \]
          By (6.6), for either a one-slot or two-slot edge,
          \[
          \frac{\operatorname{L1}(e)}{\beta\operatorname{SUP}(e)}
          \le\frac{4\eta^2X^4}{\beta}\le4\eta^2X^4,
          \]
          because \(\beta\ge1\). Also \(C_*K^2\le540X^2\) by (2.4). Hence
          \[
          \frac{\Sigma(P)}{\Sigma(P_0)}
          \le540X^2\bigl(4\eta^2X^{-26}\bigr)^f
          \le X^{-23f}
          \]
          for sufficiently large \(X\). There are at most four ratio coordinates, so
          at most \(2^4-1=15\) non-all-bad patterns. Their total is at most
          \(15X^{-23}\Sigma(P_0)\le\Sigma(P_0)\), proving the factor two. \(\square\)'''
          new = r'''**Proof.** Let \(U(P)\) denote the right-hand side of (6.5), so that
          \(\Sigma(P)\le U(P)\). Let \(P_0\) be the all-bad pattern and let \(P\)
          have \(f\ge1\) good vertices. The all-bad upper bound \(U(P_0)\) is
          positive because the principal character is bad, hence \(\beta\ge1\), and
          every group norm is positive. Dividing the two upper bounds gives
          \[
          \frac{U(P)}{U(P_0)}
          \le C_*K^2X^{-30f}
          \prod_{v\text{ good}}
          \frac{\operatorname{L1}(e_v)}{\beta\operatorname{SUP}(e_v)}.
          \]
          By (6.6), for either a one-slot or two-slot edge,
          \[
          \frac{\operatorname{L1}(e)}{\beta\operatorname{SUP}(e)}
          \le\frac{4\eta^2X^4}{\beta}\le4\eta^2X^4,
          \]
          because \(\beta\ge1\). Also \(C_*K^2\le540X^2\) by (2.4). Hence
          \[
          \frac{U(P)}{U(P_0)}
          \le540X^2\bigl(4\eta^2X^{-26}\bigr)^f
          \le X^{-23f}
          \]
          for sufficiently large \(X\). There are at most four ratio coordinates, so
          at most \(2^4-1=15\) non-all-bad patterns. Therefore
          \[
          \sum_P\Sigma(P)\le\sum_PU(P)
          \le\bigl(1+15X^{-23}\bigr)U(P_0)\le2U(P_0),
          \]
          proving the claimed domination without dividing by an actual character sum.
          \(\square\)'''
          if s.count(old) != 1:
              raise SystemExit(f"expected one proof block, found {s.count(old)}")
          p.write_text(s.replace(old, new), encoding="utf-8")

      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('publications/fortune-papers-ii-vi-20260724/paper4_random_order/manuscript.md')
          s=p.read_text()
          assert 'Let \\(U(P)\\) denote the right-hand side' in s
          assert '\\frac{\\Sigma(P)}{\\Sigma(P_0)}' not in s
          print(hashlib.sha256(s.encode()).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/fortune-papers-ii-vi-20260724/paper4_random_order/manuscript.md
          git commit -m "Formalize pattern domination using upper bounds"
          git push origin HEAD:publication/fortune-papers-ii-vi-20260724
