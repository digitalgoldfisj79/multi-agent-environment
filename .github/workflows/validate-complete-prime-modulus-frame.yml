name: Validate complete prime-modulus frame

on:
  pull_request:
    branches:
      - publication/fortune-papers-ii-vi-20260724
    paths:
      - .github/workflows/validate-complete-prime-modulus-frame.yml
      - frontier/integer_source_frame_bridge/COMPLETE_PRIME_MODULUS_FRAME_20260728.md
      - frontier/integer_source_frame_bridge/PROGRAMME_STATUS_AFTER_COMPLETE_MODULUS_FRAME_20260728.md
      - frontier/integer_source_frame_bridge/complete_prime_modulus_frame_verify.py
      - frontier/integer_source_frame_bridge/complete_prime_modulus_frame_results.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check theorem boundaries
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          test -s "$ROOT/COMPLETE_PRIME_MODULUS_FRAME_20260728.md"
          test -s "$ROOT/PROGRAMME_STATUS_AFTER_COMPLETE_MODULUS_FRAME_20260728.md"
          test -s "$ROOT/complete_prime_modulus_frame_verify.py"
          test -s "$ROOT/complete_prime_modulus_frame_results.json"
          ! grep -RInE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' \
            "$ROOT/COMPLETE_PRIME_MODULUS_FRAME_20260728.md" \
            "$ROOT/PROGRAMME_STATUS_AFTER_COMPLETE_MODULUS_FRAME_20260728.md"
          grep -Fq 'Theorem 4.1 (near-Parseval complete-modulus frame)' \
            "$ROOT/COMPLETE_PRIME_MODULUS_FRAME_20260728.md"
          grep -Fq "Fortune's conjecture remains open" \
            "$ROOT/PROGRAMME_STATUS_AFTER_COMPLETE_MODULUS_FRAME_20260728.md"

      - name: Install verifier dependencies
        run: python3 -m pip install --quiet numpy sympy

      - name: Recompute exact identity and calibration
        run: |
          set -euo pipefail
          ROOT=frontier/integer_source_frame_bridge
          cp "$ROOT/complete_prime_modulus_frame_results.json" /tmp/expected.json
          python3 "$ROOT/complete_prime_modulus_frame_verify.py" > /tmp/recomputed.stdout.json
          cp "$ROOT/complete_prime_modulus_frame_results.json" /tmp/recomputed.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path('/tmp/expected.json').read_text())
          got = json.loads(Path('/tmp/recomputed.json').read_text())
          assert expected['status'] == got['status'] == 'PASS'
          assert expected['parameters'] == got['parameters']
          assert got['direct_character_check']['identity_error'] < 1e-10
          assert len(expected['rows']) == len(got['rows']) == 6
          tol = 5e-12
          keys = (
              'minimum_eigenvalue',
              'maximum_eigenvalue',
              'operator_norm_D_minus_I',
              'maximum_off_diagonal_row_sum',
              'total_off_diagonal_mass',
              'theorem_row_bound',
          )
          for a, b in zip(expected['rows'], got['rows']):
              assert a['X'] == b['X']
              assert a['N'] == b['N']
              assert a['q_shell_count'] == b['q_shell_count']
              assert a['nonzero_off_diagonal_pairs'] == b['nonzero_off_diagonal_pairs']
              assert a['maximum_shell_divisor_count'] == b['maximum_shell_divisor_count']
              assert a['gap_divisor_histogram'] == b['gap_divisor_histogram']
              for key in keys:
                  assert abs(a[key] - b[key]) < tol, (a['X'], key, a[key], b[key])
              assert b['operator_norm_D_minus_I'] <= b['maximum_off_diagonal_row_sum'] + tol
              assert b['maximum_off_diagonal_row_sum'] <= b['theorem_row_bound'] + tol
          print(json.dumps(got['summary'], indent=2))
          PY

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: complete-prime-modulus-frame-validation
          path: |
            /tmp/expected.json
            /tmp/recomputed.json
            /tmp/recomputed.stdout.json
            frontier/integer_source_frame_bridge/COMPLETE_PRIME_MODULUS_FRAME_20260728.md
            frontier/integer_source_frame_bridge/PROGRAMME_STATUS_AFTER_COMPLETE_MODULUS_FRAME_20260728.md
            frontier/integer_source_frame_bridge/complete_prime_modulus_frame_verify.py
          retention-days: 90
