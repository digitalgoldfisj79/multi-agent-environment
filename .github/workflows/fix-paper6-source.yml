name: Repair Paper VI source delimiter

on:
  push:
    branches:
      - publication/fortune-papers-ii-vi-20260724
    paths:
      - .github/workflows/fix-paper6-source.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0
      - name: Repair missing display delimiter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md')
          s=p.read_text()
          old='''\\boxed{\n\\operatorname{card}(\\mathscr Q_p\\setminus U_p)(\\mathbf F_p)=1+(p-1)N_2,\n}\n\\['''
          new='''\\boxed{\n\\operatorname{card}(\\mathscr Q_p\\setminus U_p)(\\mathbf F_p)=1+(p-1)N_2,\n}\n\\]\n\\['''
          if old not in s:
              raise SystemExit('expected malformed sequence not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep -n -A8 -B2 'boundary and cubic open' publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md
          git commit -m 'Repair Paper VI display delimiter'
          git push origin HEAD:publication/fortune-papers-ii-vi-20260724
