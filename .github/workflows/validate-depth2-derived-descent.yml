name: Validate depth-two derived descent

on:
  pull_request:
    branches:
      - publication/fortune-papers-ii-vi-20260724
    paths:
      - .github/workflows/validate-depth2-derived-descent.yml
      - frontier/fable_programme/M3_DERIVED_DEPTH_TWO_DESCENT_20260728.md
      - frontier/fable_programme/M3_LOCAL_TANGENT_AND_BOUNDARY_AUDIT_20260728.md
      - frontier/fable_programme/local_tangent_verify.py
      - frontier/fable_programme/local_tangent_results.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate theorem boundaries and source records
        run: |
          set -euo pipefail
          ROOT=frontier/fable_programme
          for file in \
            M3_DERIVED_DEPTH_TWO_DESCENT_20260728.md \
            M3_LOCAL_TANGENT_AND_BOUNDARY_AUDIT_20260728.md \
            local_tangent_verify.py \
            local_tangent_results.json; do
            test -s "$ROOT/$file"
          done
          ! grep -RInE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' \
            "$ROOT/M3_DERIVED_DEPTH_TWO_DESCENT_20260728.md" \
            "$ROOT/M3_LOCAL_TANGENT_AND_BOUNDARY_AUDIT_20260728.md" \
            "$ROOT/local_tangent_verify.py" \
            "$ROOT/local_tangent_results.json"
          grep -Fq 'finite-length structure-sheaf Witt cohomology over `F_p`' "$ROOT/M3_DERIVED_DEPTH_TWO_DESCENT_20260728.md"
          grep -Fq 'The next theorem task is the integral comparison DDT2' "$ROOT/M3_DERIVED_DEPTH_TWO_DESCENT_20260728.md"
          grep -Fq 'tangent representation alone does not determine' "$ROOT/M3_LOCAL_TANGENT_AND_BOUNDARY_AUDIT_20260728.md"

      - name: Recompute local tangent representations
        run: |
          set -euo pipefail
          python3 frontier/fable_programme/local_tangent_verify.py > /tmp/local_tangent_recomputed.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          got = json.loads(Path('/tmp/local_tangent_recomputed.json').read_text())
          expected = json.loads(Path('frontier/fable_programme/local_tangent_results.json').read_text())
          assert got == expected
          for row in got['rows']:
              p = row['p']
              assert row['constraint_rank'] == p - 4
              assert row['affine_tangent_dimension'] == 4
              assert row['projective_surface_tangent_dimension'] == 2
              assert row['generator_matrix_basis_i2_i3'] == [[1, 3 % p], [0, 1]]
              assert row['fixed_dimension'] == 1
              assert row['nontrivial_unipotent'] is True
          print(json.dumps(got, indent=2))
          PY

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: depth2-derived-descent-validation
          path: |
            /tmp/local_tangent_recomputed.json
            frontier/fable_programme/M3_DERIVED_DEPTH_TWO_DESCENT_20260728.md
            frontier/fable_programme/M3_LOCAL_TANGENT_AND_BOUNDARY_AUDIT_20260728.md
            frontier/fable_programme/local_tangent_verify.py
            frontier/fable_programme/local_tangent_results.json
          retention-days: 90
