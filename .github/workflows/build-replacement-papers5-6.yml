name: Build replacement Papers V and VI

on:
  push:
    branches:
      - publication/fortune-papers-ii-vi-20260724
    paths:
      - .github/workflows/build-replacement-papers5-6.yml
      - scripts/pandoc_targeted_display_math_images.py
      - scripts/centre_docx_equation_images.py
      - publications/fortune-papers-ii-vi-20260724/paper5_function_fields_replacement/INDEPENDENT_REVIEW_DISPOSITION_FINAL.md
      - publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/INDEPENDENT_REVIEW_DISPOSITION_FINAL.md
      - publications/fortune-papers-ii-vi-20260724/paper5_function_fields_replacement/manuscript.md
      - publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md
      - publications/fortune-papers-ii-vi-20260724/paper5_function_fields_replacement/TYPESETTING_NORMALISATIONS.md
      - publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/TYPESETTING_NORMALISATIONS.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replacement-papers-v-vi-release
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0
      - id: check
        name: Check final-review gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=publications/fortune-papers-ii-vi-20260724
          required=(
            "$ROOT/paper5_function_fields_replacement/INDEPENDENT_REVIEW_RAW_FINAL.md"
            "$ROOT/paper5_function_fields_replacement/INDEPENDENT_REVIEW_DISPOSITION_FINAL.md"
            "$ROOT/paper6_secondary_quotients_replacement/INDEPENDENT_REVIEW_RAW_FINAL.md"
            "$ROOT/paper6_secondary_quotients_replacement/INDEPENDENT_REVIEW_DISPOSITION_FINAL.md"
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Not ready: missing $file"
              missing=1
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

  build-and-audit:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            lmodern biber poppler-utils qpdf libreoffice-writer libreoffice-math \
            zip unzip g++ fonts-dejavu-core
          python3 -m pip install --break-system-packages python-docx pypdf
          pandoc --version | head -2
          xelatex --version | head -1
          libreoffice --version

      - name: Run independent mathematical reconstructions
        run: |
          set -euo pipefail
          P5=publications/fortune-papers-ii-vi-20260724/paper5_function_fields_replacement
          P6=publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement
          python3 "$P5/paper5_independent_reconstruction.py" | tee "$P5/independent_reconstruction_run.log"
          g++ -O2 -std=c++17 "$P5/sparse_surface_singularity_independent.cpp" -o /tmp/p5_singularity
          (cd "$P5" && /tmp/p5_singularity | tee sparse_surface_singularity_run.log)
          python3 "$P6/paper6_independent_reconstruction.py" | tee "$P6/independent_reconstruction_run.log"

      - name: Validate frozen source hygiene
        run: |
          set -euo pipefail
          for paper in \
            publications/fortune-papers-ii-vi-20260724/paper5_function_fields_replacement \
            publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement; do
            for file in manuscript.md references.bib CLAIM_STATUS.md SOURCE_FIDELITY_MATRIX.md \
              SOURCE_MANIFEST.tsv CITATION.cff ZENODO_METADATA.json RELEASE_CHECKLIST.md \
              TYPESETTING_NORMALISATIONS.md INDEPENDENT_REVIEW_RAW_FINAL.md \
              INDEPENDENT_REVIEW_DISPOSITION_FINAL.md; do
              test -s "$paper/$file" || { echo "Missing required file: $paper/$file"; exit 1; }
            done
            if grep -nE 'TODO|TBD|PLACEHOLDER|REPLACE_ME' \
              "$paper/manuscript.md" "$paper/CLAIM_STATUS.md" "$paper/SOURCE_FIDELITY_MATRIX.md"; then
              echo "Unresolved placeholder found in $paper"
              exit 1
            fi
            python3 - "$paper/manuscript.md" <<'PY'
          import hashlib
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          if b'\x00' in data:
              raise SystemExit(f'NUL byte in {path}')
          print(f'{path}: {len(data)} bytes, {data.count(bytes([10])) + 1} lines')
          print(hashlib.sha256(data).hexdigest(), path)
          PY
          done

      - name: Build publication artefacts
        run: |
          set -euo pipefail
          BUILD_LOG="$RUNNER_TEMP/build-publication-artefacts.log"
          exec > >(tee "$BUILD_LOG") 2>&1
          ROOT="$GITHUB_WORKSPACE/publications/fortune-papers-ii-vi-20260724"
          OUT="$RUNNER_TEMP/fortune-papers5-6-release"
          mkdir -p "$OUT/paper5" "$OUT/paper6"

          build_one () {
            SRC="$1"; DEST="$2"; STEM="$3"; TITLE="$4"
            echo "=== Building $STEM from $SRC ==="
            PDF_SOURCE="$SRC/manuscript.md"
            DOCX_SOURCE="$SRC/manuscript.md"
            TEX_SOURCE="$SRC/manuscript.md"

            if [[ "$STEM" == 'fortune-paper-v' ]]; then
              DOCX_SOURCE="$RUNNER_TEMP/$STEM-docx-normalised.md"
              python3 - "$SRC/manuscript.md" "$DOCX_SOURCE" <<'PY'
          from pathlib import Path
          import re
          import sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          old_inline = r'q\in\mathbf F_p^*\setminus\{2\}'
          new_inline = r'q\in\mathbf F_p^\times,\ q\ne2'
          if source.count(old_inline) != 2:
              raise SystemExit(f'Expected two Paper V inline domain normalisations, found {source.count(old_inline)}')
          normalised = source.replace(old_inline, new_inline)
          normalised = re.sub(r'(?<!\n)\n\\\[\n', '\n\n\\[\n', normalised)
          normalised = re.sub(r'\n\\\]\n(?!\n)', '\n\\]\n\n', normalised)
          Path(sys.argv[2]).write_text(normalised, encoding='utf-8')
          PY
            fi

            if [[ "$STEM" == 'fortune-paper-vi' ]]; then
              NORMAL_SOURCE="$RUNNER_TEMP/$STEM-typeset-normalised.md"
              python3 - "$SRC/manuscript.md" "$NORMAL_SOURCE" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          needle = '\\]\n### Proof'
          if source.count(needle) != 1:
              raise SystemExit(f'Expected exactly one Paper VI Markdown-boundary normalisation, found {source.count(needle)}')
          Path(sys.argv[2]).write_text(source.replace(needle, '\\]\n\n### Proof'), encoding='utf-8')
          PY
              PDF_SOURCE="$NORMAL_SOURCE"
              DOCX_SOURCE="$NORMAL_SOURCE"
              TEX_SOURCE="$NORMAL_SOURCE"
            fi

            pandoc -f markdown+tex_math_single_backslash "$PDF_SOURCE" \
              --resource-path="$SRC" --bibliography="$SRC/references.bib" --citeproc \
              --pdf-engine=xelatex \
              --metadata title="$TITLE" --metadata author='Edward Stewart Anthony Bozzard' \
              -V papersize=a4 -V geometry:margin=25mm -V colorlinks=true \
              -o "$DEST/$STEM.pdf"

            if [[ "$STEM" == 'fortune-paper-v' ]]; then
              MEDIA="$RUNNER_TEMP/$STEM-equation-media"
              pandoc -f markdown+tex_math_single_backslash "$DOCX_SOURCE" \
                --resource-path="$SRC" --bibliography="$SRC/references.bib" --citeproc \
                --metadata title="$TITLE" --metadata author='Edward Stewart Anthony Bozzard' \
                -t json \
              | python3 "$GITHUB_WORKSPACE/scripts/pandoc_targeted_display_math_images.py" "$MEDIA" \
              | pandoc -f json -o "$DEST/$STEM.docx"
              python3 "$GITHUB_WORKSPACE/scripts/centre_docx_equation_images.py" \
                "$DEST/$STEM.docx" 4
            else
              pandoc -f markdown+tex_math_single_backslash "$DOCX_SOURCE" \
                --resource-path="$SRC" --bibliography="$SRC/references.bib" --citeproc \
                --metadata title="$TITLE" --metadata author='Edward Stewart Anthony Bozzard' \
                -o "$DEST/$STEM.docx"
            fi

            pandoc -f markdown+tex_math_single_backslash "$TEX_SOURCE" \
              --resource-path="$SRC" --bibliography="$SRC/references.bib" --citeproc -s -t latex \
              --metadata title="$TITLE" --metadata author='Edward Stewart Anthony Bozzard' \
              -o "$DEST/$STEM.tex"

            cp "$SRC"/{manuscript.md,references.bib,CLAIM_STATUS.md,SOURCE_FIDELITY_MATRIX.md,SOURCE_MANIFEST.tsv,INDEPENDENT_RECONSTRUCTION.md,CITATION.cff,ZENODO_METADATA.json,RELEASE_CHECKLIST.md,TYPESETTING_NORMALISATIONS.md} "$DEST/"
            sha256sum "$SRC/manuscript.md" > "$DEST/MANUSCRIPT_SHA256.txt"
            find "$SRC" -maxdepth 1 -type f \
              \( -name '*independent_reconstruction*.py' \
              -o -name '*independent_reconstruction*_results.json' \
              -o -name '*singularity*' \
              -o -name 'INDEPENDENT_REVIEW*.md' \) \
              -exec cp {} "$DEST/" \;
          }

          build_one "$ROOT/paper5_function_fields_replacement" "$OUT/paper5" \
            fortune-paper-v 'Fortunate Polynomials over Finite Fields'
          build_one "$ROOT/paper6_secondary_quotients_replacement" "$OUT/paper6" \
            fortune-paper-vi 'Secondary Traces and Kummer Quotients for the Function-Field Fortune Crown'

          if grep -Fq 'Could not convert TeX math' "$BUILD_LOG"; then
            echo 'Pandoc failed to convert at least one TeX equation.'
            exit 1
          fi
          echo "$OUT" > "$RUNNER_TEMP/release_path"

      - name: PDF and DOCX semantic/preflight audit
        run: |
          set -euo pipefail
          OUT=$(cat "$RUNNER_TEMP/release_path")
          export HOME="$RUNNER_TEMP/libreoffice-home"
          mkdir -p "$HOME"

          for dir in "$OUT/paper5" "$OUT/paper6"; do
            PDF=$(find "$dir" -maxdepth 1 -name '*.pdf' -print -quit)
            DOCX=$(find "$dir" -maxdepth 1 -name '*.docx' -print -quit)
            test -s "$PDF"; test -s "$DOCX"

            qpdf --check "$PDF"
            pdfinfo "$PDF" | tee "$dir/PDF_INFO.txt"
            grep -Fq 'A4' "$dir/PDF_INFO.txt"
            pdffonts "$PDF" | tee "$dir/PDF_FONTS.txt"
            python3 - "$dir/PDF_FONTS.txt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          failures=[]
          for line in path.read_text(errors='replace').splitlines()[2:]:
              fields=line.split()
              if len(fields) >= 5 and fields[-5] != 'yes':
                  failures.append(line)
          if failures:
              raise SystemExit('Unembedded PDF fonts:\n' + '\n'.join(failures))
          print(f'{path}: all listed fonts embedded')
          PY
            pdftotext -layout "$PDF" "$dir/PDF_EXTRACTED.txt"

            python3 - "$DOCX" "$dir/DOCX_EXTRACTED.txt" <<'PY'
          from docx import Document
          from pathlib import Path
          import sys
          document = Document(sys.argv[1])
          Path(sys.argv[2]).write_text('\n'.join(p.text for p in document.paragraphs), encoding='utf-8')
          PY

            mkdir -p "$dir/docx-render"
            libreoffice --headless --nologo --nodefault --nolockcheck --nofirststartwizard \
              --convert-to pdf --outdir "$dir/docx-render" "$DOCX" \
              | tee "$dir/LIBREOFFICE_RENDER.log"
            RENDERED=$(find "$dir/docx-render" -name '*.pdf' -print -quit)
            test -s "$RENDERED"
            qpdf --check "$RENDERED"
            pdfinfo "$RENDERED" | tee "$dir/DOCX_RENDER_INFO.txt"
            grep -Fq 'A4' "$dir/DOCX_RENDER_INFO.txt"
            pdftotext -layout "$RENDERED" "$dir/DOCX_RENDER_EXTRACTED.txt"

            python3 - "$dir" <<'PY'
          from pathlib import Path
          import re
          import sys
          directory = Path(sys.argv[1])
          def norm(name):
              text = (directory / name).read_text(errors='replace').lower()
              return re.sub(r'\s+', ' ', text)
          texts = {
              'pdf': norm('PDF_EXTRACTED.txt'),
              'docx': norm('DOCX_EXTRACTED.txt'),
              'docx-render': norm('DOCX_RENDER_EXTRACTED.txt'),
          }
          required = ('function-field', 'crown', 'remains open')
          for label, text in texts.items():
              missing = [term for term in required if term not in text]
              if missing:
                  raise SystemExit(f'{directory.name} {label}: missing semantic markers {missing}')
              if '### proof' in text:
                  raise SystemExit(f'{directory.name} {label}: literal Markdown proof heading leaked')
          for label in ('docx', 'docx-render'):
              leaked = [token for token in (r'\bigl', r'\bigr', '$$') if token in texts[label]]
              if leaked:
                  raise SystemExit(f'{directory.name} {label}: literal TeX leaked: {leaked}')
          ratio = len(texts['docx-render']) / max(1, len(texts['pdf']))
          if ratio < 0.80:
              raise SystemExit(f'{directory.name}: DOCX-render text completeness ratio {ratio:.3f} < 0.80')
          print(f'{directory.name}: semantic checks passed; render completeness ratio={ratio:.3f}')
          PY
          done

      - name: DOCX structure, equation and accessibility audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from docx import Document
          import json
          import os
          import zipfile

          root = Path(os.environ['RUNNER_TEMP']) / 'fortune-papers5-6-release'
          for directory in (root / 'paper5', root / 'paper6'):
              docx = next(directory.glob('*.docx'))
              document = Document(docx)
              headings=[]; empty=[]; findings=[]
              for index, paragraph in enumerate(document.paragraphs):
                  if paragraph.style and paragraph.style.name.startswith('Heading'):
                      headings.append((index, paragraph.style.name, paragraph.text))
                      if not paragraph.text.strip():
                          empty.append(index)
              if not headings:
                  findings.append('no headings')
              if empty:
                  findings.append(f'empty headings: {empty}')
              if not (document.core_properties.title or '').strip():
                  findings.append('missing title metadata')
              if not (document.core_properties.author or '').strip():
                  findings.append('missing author metadata')

              with zipfile.ZipFile(docx) as archive:
                  xml = archive.read('word/document.xml').decode('utf-8')
                  media = [name for name in archive.namelist() if name.startswith('word/media/')]
              omath_count = xml.count('<m:oMath')
              drawing_count = xml.count('<w:drawing')
              png_count = sum(name.lower().endswith('.png') for name in media)
              if omath_count < 20:
                  findings.append(f'too few OMML equation objects: {omath_count}')
              if directory.name == 'paper5':
                  if drawing_count < 4:
                      findings.append(f'too few targeted equation drawings: {drawing_count}')
                  if png_count < 4:
                      findings.append(f'too few targeted equation PNGs: {png_count}')

              report={
                  'file':docx.name,
                  'paragraphs':len(document.paragraphs),
                  'headings':headings,
                  'tables':len(document.tables),
                  'omath_count':omath_count,
                  'drawing_count':drawing_count,
                  'png_count':png_count,
                  'findings':findings,
              }
              (directory/'DOCX_ACCESSIBILITY_AUDIT.json').write_text(
                  json.dumps(report, indent=2), encoding='utf-8'
              )
              if findings:
                  raise SystemExit(report)
              print(json.dumps(report, indent=2))
          PY

      - name: Package and checksum
        run: |
          set -euo pipefail
          OUT=$(cat "$RUNNER_TEMP/release_path")
          cp "$GITHUB_WORKSPACE/scripts/pandoc_targeted_display_math_images.py" "$OUT/"
          cp "$GITHUB_WORKSPACE/scripts/centre_docx_equation_images.py" "$OUT/"
          printf '%s\n' "Repository commit: $GITHUB_SHA" > "$OUT/BUILD_PROVENANCE.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          (cd "$OUT" && zip -qr "$RUNNER_TEMP/fortune-papers-v-vi-internal-release.zip" .)
          sha256sum "$RUNNER_TEMP/fortune-papers-v-vi-internal-release.zip" > "$OUT/ARCHIVE_SHA256.txt"

      - name: Upload canonical internal release
        uses: actions/upload-artifact@v4
        with:
          name: fortune-papers-v-vi-internal-release
          path: |
            ${{ runner.temp }}/fortune-papers5-6-release
            ${{ runner.temp }}/fortune-papers-v-vi-internal-release.zip
          retention-days: 90

      - name: Record observable workflow status
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin publication/fortune-papers-ii-vi-20260724
          git reset --hard origin/publication/fortune-papers-ii-vi-20260724
          STATUS_FILE=publications/fortune-papers-ii-vi-20260724/PAPERS_V_VI_AUTOMATED_BUILD_STATUS.md
          cat > "$STATUS_FILE" <<EOF
          # Papers V--VI automated release status

          - workflow: Build replacement Papers V and VI
          - run ID: \`$RUN_ID\`
          - attempt: \`$RUN_ATTEMPT\`
          - source commit: \`$SOURCE_SHA\`
          - conclusion: **$RUN_STATUS**
          - run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID

          A success conclusion means the independent reconstructions, frozen-source checks, canonical PDF/LaTeX/DOCX builds, targeted equation conversion, semantic extraction, PDF preflight, independent LibreOffice render, equation/accessibility audit, checksums and artefact upload all passed.
          EOF
          if [[ -f "$RUNNER_TEMP/build-publication-artefacts.log" ]]; then
            {
              echo
              echo '## Publication build log tail'
              echo
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/build-publication-artefacts.log"
              echo '```'
            } >> "$STATUS_FILE"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS_FILE"
          git commit -m "Record Papers V-VI workflow $RUN_ID: $RUN_STATUS" || exit 0
          git push origin HEAD:publication/fortune-papers-ii-vi-20260724
