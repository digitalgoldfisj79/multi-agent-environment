name: Validate punctured-centre off-diagonal gate

on:
  push:
    branches:
      - gpt56/fortune-mesoscopic-cotlar-20260728
  pull_request:
    paths:
      - 'frontier/integer_source_frame_bridge/punctured_centre_offdiagonal_verify.py'
      - 'frontier/integer_source_frame_bridge/punctured_centre_offdiagonal_results.json'
      - '.github/workflows/validate-punctured-centre-offdiagonal.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run punctured-centre exact verifier
        run: python frontier/integer_source_frame_bridge/punctured_centre_offdiagonal_verify.py
      - name: Check committed results are reproducible
        run: git diff --exit-code -- frontier/integer_source_frame_bridge/punctured_centre_offdiagonal_results.json
