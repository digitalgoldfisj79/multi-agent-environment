name: Validate FF cubic oriented-coefficient geometry

on:
  push:
    branches:
      - gpt56/fortune-mesoscopic-cotlar-20260728
    paths:
      - fortune-review/scripts/ff_nonzero_defect_cubic_oriented_coefficient.py
      - .github/workflows/ff-nonzero-defect-cubic-oriented-coefficient.yml
  pull_request:
    paths:
      - fortune-review/scripts/ff_nonzero_defect_cubic_oriented_coefficient.py
      - .github/workflows/ff-nonzero-defect-cubic-oriented-coefficient.yml
  workflow_dispatch:

jobs:
  local-oriented-coefficient:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra tools
        run: |
          sudo apt-get update
          sudo apt-get install -y singular msolve
          python -m pip install --disable-pip-version-check sympy
      - name: Verify reduction and tangent rank
        run: |
          python fortune-review/scripts/ff_nonzero_defect_cubic_oriented_coefficient.py \
            --verify | tee /tmp/oriented-audit.json
          grep '"jacobian_rank": 16' /tmp/oriented-audit.json
      - name: Generate compact local and global systems
        run: |
          python fortune-review/scripts/ff_nonzero_defect_cubic_oriented_coefficient.py \
            --local-singular /tmp/oriented-local.sing \
            --msolve /tmp/oriented.ms
      - name: Compute local standard basis
        run: |
          set -o pipefail
          timeout 45m Singular -q /tmp/oriented-local.sing \
            | tee /tmp/oriented-local-result.txt
          grep '^STATUS=COMPUTED$' /tmp/oriented-local-result.txt
          grep '^DIM=' /tmp/oriented-local-result.txt
      - name: Compute unsaturated global dimension discriminator
        run: |
          timeout 10m msolve -v 1 -g 1 -t 4 \
            -f /tmp/oriented.ms -o /tmp/oriented-msolve.txt \
            > /tmp/oriented-msolve.log 2>&1 || true
          cat /tmp/oriented-msolve.txt 2>/dev/null || true
      - name: Upload certificates
        uses: actions/upload-artifact@v4
        with:
          name: ff-cubic-oriented-coefficient
          path: |
            /tmp/oriented-audit.json
            /tmp/oriented-local.sing
            /tmp/oriented-local-result.txt
            /tmp/oriented.ms
            /tmp/oriented-msolve.txt
            /tmp/oriented-msolve.log
