name: Validate Fortune integrated closeout

"on":
  push:
    branches:
      - "gpt56/fortune-integrated-mainline-v01-20260804"
      - "publication/fortune-papers-ii-vi-20260724"
    paths:
      - "fortune-formal/**"
      - "fortune-mainline/**"
      - "publications/fortune-conditional-and-barriers-20260806/**"
      - ".github/workflows/fortune-mainline-closeout.yml"
  pull_request:
    paths:
      - "fortune-formal/**"
      - "fortune-mainline/**"
      - "publications/fortune-conditional-and-barriers-20260806/**"
      - ".github/workflows/fortune-mainline-closeout.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "fortune-mainline-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  integrated-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify integrated closeout and trust boundaries
        run: |
          python3 fortune-mainline/scripts/verify_mainline.py
          python3 publications/fortune-conditional-and-barriers-20260806/scripts/verify_publication.py

  lean-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fortune-formal
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Confirm pinned Lean version
        run: |
          set -euo pipefail
          "$HOME/.elan/bin/lean" --version | tee /tmp/lean-version.txt
          grep -F "version 4.32.0" /tmp/lean-version.txt
      - name: Fetch mathlib cache
        run: "$HOME/.elan/bin/lake" exe cache get
      - name: Build integrated formal package
        run: "$HOME/.elan/bin/lake" build FortuneFormal
      - name: Re-run trust audits
        run: |
          python3 scripts/verify_programme.py
          python3 ../fortune-mainline/scripts/verify_mainline.py

  replacement-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rerun replacement Paper V reconstruction
        run: python3 publications/fortune-papers-ii-vi-20260724/paper5_function_fields_replacement/paper5_independent_reconstruction.py
      - name: Rerun replacement Paper VI reconstruction
        run: python3 publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/paper6_independent_reconstruction.py
