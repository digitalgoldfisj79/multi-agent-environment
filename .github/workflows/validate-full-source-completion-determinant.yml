name: Validate full-source completion and determinant

on:
  push:
    branches:
      - gpt56/fortune-mesoscopic-cotlar-20260728
    paths:
      - "frontier/integer_source_frame_bridge/FULL_SOURCE_COMPLETION_AND_CENTERED_DETERMINANT_20260730.md"
      - "frontier/integer_source_frame_bridge/PROGRAMME_STATUS_AFTER_FULL_SOURCE_COMPLETION_SEQUENCE_20260730.md"
      - "frontier/integer_source_frame_bridge/full_source_completion_determinant_verify.py"
      - "frontier/integer_source_frame_bridge/full_source_completion_determinant_results.json"
      - ".github/workflows/validate-full-source-completion-determinant.yml"
  pull_request:
    paths:
      - "frontier/integer_source_frame_bridge/FULL_SOURCE_COMPLETION_AND_CENTERED_DETERMINANT_20260730.md"
      - "frontier/integer_source_frame_bridge/PROGRAMME_STATUS_AFTER_FULL_SOURCE_COMPLETION_SEQUENCE_20260730.md"
      - "frontier/integer_source_frame_bridge/full_source_completion_determinant_verify.py"
      - "frontier/integer_source_frame_bridge/full_source_completion_determinant_results.json"
      - ".github/workflows/validate-full-source-completion-determinant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full-source completion verifier
        run: python frontier/integer_source_frame_bridge/full_source_completion_determinant_verify.py
      - name: Require frozen result match
        run: git diff --exit-code -- frontier/integer_source_frame_bridge/full_source_completion_determinant_results.json
