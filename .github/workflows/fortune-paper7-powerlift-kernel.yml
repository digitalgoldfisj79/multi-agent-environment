name: Fortune Paper VII kernel power lifts

on:
  push:
    branches:
      - 'gpt56/fortune-zeta23-compression-v01-20260811'
    paths:
      - 'fortune-zeta23-transfer-v01/formal/generate_powerlift_lean.py'
      - 'fortune-corpus-novelty-assurance-v1/paper7/chart_power_lifts.sing'
      - '.github/workflows/fortune-paper7-powerlift-kernel.yml'
  workflow_dispatch:

jobs:
  certificate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: B
            target: 1
          - chart: B
            target: 2
          - chart: B
            target: 3
          - chart: X
            target: 1
          - chart: X
            target: 2
          - chart: X
            target: 3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular and Lean
        run: |
          sudo apt-get update
          sudo apt-get install -y singular
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        working-directory: fortune-formal
        run: |
          elan toolchain install $(cat lean-toolchain)
          lake update
          lake exe cache get
      - name: Regenerate exact Singular power lifts
        run: |
          Singular fortune-corpus-novelty-assurance-v1/paper7/chart_power_lifts.sing > /tmp/power_lifts_exact.out
          grep -A1 'B_REDUCE_BEGIN' /tmp/power_lifts_exact.out | grep -q '^_\[1\]=0'
          grep -A1 'X_REDUCE_BEGIN' /tmp/power_lifts_exact.out | grep -q '^_\[1\]=0'
      - name: Generate exact Lean certificate
        run: |
          python fortune-zeta23-transfer-v01/formal/generate_powerlift_lean.py \
            /tmp/power_lifts_exact.out \
            --chart '${{ matrix.chart }}' --target '${{ matrix.target }}' \
            --output '/tmp/PowerLift_${{ matrix.chart }}_${{ matrix.target }}.lean' \
            | tee '/tmp/generate_${{ matrix.chart }}_${{ matrix.target }}.log'
      - name: Kernel check certificate
        working-directory: fortune-formal
        run: |
          lake env lean '/tmp/PowerLift_${{ matrix.chart }}_${{ matrix.target }}.lean' \
            | tee '/tmp/lean_${{ matrix.chart }}_${{ matrix.target }}.log'
      - name: Upload exact certificate
        uses: actions/upload-artifact@v4
        with:
          name: 'fortune-paper7-powerlift-${{ matrix.chart }}-${{ matrix.target }}'
          path: |
            /tmp/PowerLift_${{ matrix.chart }}_${{ matrix.target }}.lean
            /tmp/generate_${{ matrix.chart }}_${{ matrix.target }}.log
          retention-days: 30
