# Canonical release trigger: 24 July 2026
name: Build Papers II and III release artifacts

on:
  pull_request:
    branches:
      - gpt56/d1-gate-bridge-terminal-20260724
    paths:
      - .github/workflows/build-papers2-3-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00d2a67d9963848e35596ea153917e73c2dfeb17
          fetch-depth: 0

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended poppler-utils zip python3-docx libreoffice-writer

      - name: Verify exact reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          P2='publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md'
          P3='publications/fortune-papers-ii-vi-20260724/paper3_pair_sum/manuscript.md'
          test "$(sha256sum "$P2" | awk '{print $1}')" = '632bb8f4fd89a51020069327a11fe57f8ae882e57bd4ae1a9ed0829030c32ce1'
          test "$(sha256sum "$P3" | awk '{print $1}')" = '1753e5991ccab15142d9bd076554c283a69bfa3bd8aa9448b2edf62f50c4c7cb'

      - name: Build publication-grade PDF and DOCX files
        shell: bash
        run: |
          set -euo pipefail
          ROOT='publications/fortune-papers-ii-vi-20260724'
          DIST="$ROOT/papers2-3-dist"
          rm -rf "$DIST"
          mkdir -p "$DIST/paper2_release" "$DIST/paper3_release" "$DIST/combined_release"

          cp "$ROOT/paper2_revised/manuscript.md" "$DIST/paper2_release/manuscript.md"
          cp "$ROOT/paper2_revised/references.bib" "$DIST/paper2_release/references.bib"
          cp "$ROOT/paper3_pair_sum/manuscript.md" "$DIST/paper3_release/manuscript.md"

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('publications/fortune-papers-ii-vi-20260724')
          dist=root/'papers2-3-dist'
          specs=[('paper2_revised','paper2'),('paper3_pair_sum','paper3')]
          records=[]
          for srcdir,key in specs:
              source=(root/srcdir/'manuscript.md').read_text(encoding='utf-8')
              bigl=source.count('\\Bigl'); bigr=source.count('\\Bigr')
              rendered=source.replace('\\Bigl','\\left').replace('\\Bigr','\\right')
              rendered,tags=re.subn(r'\\tag\{([^}]+)\}',r'\\qquad \\text{(\1)}',rendered)
              out=dist/f'{key}_render_source.docx.md'
              out.write_text(rendered,encoding='utf-8')
              records.append((key,bigl,bigr,tags))
          with (dist/'TYPESETTING_COUNTS.tsv').open('w',encoding='utf-8') as f:
              f.write('paper\tBigl\tBigr\ttags\n')
              for row in records:f.write('\t'.join(map(str,row))+'\n')
          PY

          pandoc "$DIST/paper2_render_source.docx.md" \
            --from=markdown+tex_math_dollars+tex_math_single_backslash+raw_tex \
            --to=docx --standalone --citeproc \
            --bibliography="$ROOT/paper2_revised/references.bib" \
            -o "$DIST/paper2_release/Paper_II_Prime_Detection_at_Primorial_Centres.docx"

          pandoc "$DIST/paper3_render_source.docx.md" \
            --from=markdown+tex_math_dollars+tex_math_single_backslash+raw_tex \
            --to=docx --standalone \
            -o "$DIST/paper3_release/Paper_III_Pair_Sum_Rigidity.docx"

          python3 - <<'PY'
          from docx import Document
          from docx.shared import Mm, Pt
          from pathlib import Path
          for path in Path('publications/fortune-papers-ii-vi-20260724/papers2-3-dist').glob('paper*_release/*.docx'):
              doc=Document(path)
              for sec in doc.sections:
                  sec.page_width=Mm(210); sec.page_height=Mm(297)
                  sec.top_margin=Mm(23); sec.bottom_margin=Mm(23)
                  sec.left_margin=Mm(24); sec.right_margin=Mm(24)
              doc.styles['Normal'].font.size=Pt(10.5)
              doc.save(path)
          PY

          pandoc "$ROOT/paper2_revised/manuscript.md" \
            --from=markdown+tex_math_dollars+tex_math_single_backslash+raw_tex \
            --standalone --citeproc \
            --bibliography="$ROOT/paper2_revised/references.bib" \
            --pdf-engine=xelatex -V geometry:margin=24mm -V papersize:a4 \
            -o "$DIST/paper2_release/Paper_II_Prime_Detection_at_Primorial_Centres.pdf"

          pandoc "$ROOT/paper3_pair_sum/manuscript.md" \
            --from=markdown+tex_math_dollars+tex_math_single_backslash+raw_tex \
            --standalone --pdf-engine=xelatex \
            -V geometry:margin=24mm -V papersize:a4 \
            -o "$DIST/paper3_release/Paper_III_Pair_Sum_Rigidity.pdf"

          test -s "$DIST/paper2_release/Paper_II_Prime_Detection_at_Primorial_Centres.pdf"
          test -s "$DIST/paper2_release/Paper_II_Prime_Detection_at_Primorial_Centres.docx"
          test -s "$DIST/paper3_release/Paper_III_Pair_Sum_Rigidity.pdf"
          test -s "$DIST/paper3_release/Paper_III_Pair_Sum_Rigidity.docx"

      - name: Add final audit records
        shell: bash
        run: |
          set -euo pipefail
          ROOT='publications/fortune-papers-ii-vi-20260724'
          DIST="$ROOT/papers2-3-dist"
          git fetch origin gpt56/papers2-3-final-audit-20260724
          REF='origin/gpt56/papers2-3-final-audit-20260724'
          BASE='fortune-conjecture/papers2-3-final-audit-20260724'
          for f in INDEPENDENT_CHECKS.md PAPER_II_FIDELITY_MATRIX.md PAPER_III_FIDELITY_MATRIX.md AUDIT_REPORT.md FRESH_HOSTILE_REVIEW_PAPER_II_QWEN3_14B_AWQ.md FRESH_HOSTILE_REVIEW_PAPER_III_QWEN3_14B_AWQ.md HOSTILE_REVIEW_DISPOSITION.md FIDELITY_AND_EXTERNAL_REVIEW_GATES.md; do
            git show "$REF:$BASE/$f" > "$DIST/combined_release/$f"
          done
          cp "$DIST/combined_release/"*.md "$DIST/paper2_release/"
          cp "$DIST/combined_release/"*.md "$DIST/paper3_release/"

      - name: Verify extraction, metadata and package integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT='publications/fortune-papers-ii-vi-20260724'
          DIST="$ROOT/papers2-3-dist"
          P2="$DIST/paper2_release"
          P3="$DIST/paper3_release"

          pandoc "$P2/Paper_II_Prime_Detection_at_Primorial_Centres.docx" -t plain -o "$P2/docx_extracted.txt"
          pdftotext -layout "$P2/Paper_II_Prime_Detection_at_Primorial_Centres.pdf" "$P2/pdf_extracted.txt"
          pandoc "$P3/Paper_III_Pair_Sum_Rigidity.docx" -t plain -o "$P3/docx_extracted.txt"
          pdftotext -layout "$P3/Paper_III_Pair_Sum_Rigidity.pdf" "$P3/pdf_extracted.txt"

          python3 - "$P2/docx_extracted.txt" "$P2/pdf_extracted.txt" "$P3/docx_extracted.txt" "$P3/pdf_extracted.txt" <<'PY'
          import re,sys,unicodedata
          def norm(path):
              s=open(path,encoding='utf-8',errors='replace').read()
              s=unicodedata.normalize('NFKD',s).lower()
              return ' '.join(re.sub(r'[^a-z0-9]+',' ',s).split())
          checks={
            1:[('block','variance','criterion'),('exact','weighted','harmonic','reduction'),('mobius','truncation'),('fortune','conjecture','not','proved'),('ai','assistance','disclosure')],
            2:[('block','variance','criterion'),('exact','weighted','harmonic','reduction'),('mobius','truncation'),('fortune','conjecture','not','proved'),('ai','assistance','disclosure')],
            3:[('difference','multiplicity','dichotomy'),('sub','weibull'),('block','averaged','conditional','criterion'),('hardy','littlewood'),('ai','assistance','disclosure')],
            4:[('difference','multiplicity','dichotomy'),('sub','weibull'),('block','averaged','conditional','criterion'),('hardy','littlewood'),('ai','assistance','disclosure')],
          }
          for i,path in enumerate(sys.argv[1:],1):
              text=norm(path); assert len(text)>12000,(path,len(text))
              for words in checks[i]: assert all(w in text for w in words),(path,words)
          PY

          pdfinfo "$P2/Paper_II_Prime_Detection_at_Primorial_Centres.pdf" > "$P2/pdfinfo.txt"
          pdfinfo "$P3/Paper_III_Pair_Sum_Rigidity.pdf" > "$P3/pdfinfo.txt"
          pdffonts "$P2/Paper_II_Prime_Detection_at_Primorial_Centres.pdf" > "$P2/pdffonts.txt"
          pdffonts "$P3/Paper_III_Pair_Sum_Rigidity.pdf" > "$P3/pdffonts.txt"
          grep -Fq '(A4)' "$P2/pdfinfo.txt"
          grep -Fq '(A4)' "$P3/pdfinfo.txt"

          cat > "$P2/TYPESETTING_NORMALISATIONS.md" <<'EOF'
          # Typesetting normalisations

          The PDF is generated directly from the exact reviewed Markdown with Pandoc, citeproc and XeLaTeX. For editable DOCX/OMML output only, TeX `\tag{...}` commands become appended mathematical labels and `\Bigl`/`\Bigr` become `\left`/`\right`. These conversions preserve notation and equation numbering but not right-margin tag alignment in Word. No mathematical statement, hypothesis, exponent or symbol is changed.
          EOF
          cp "$P2/TYPESETTING_NORMALISATIONS.md" "$P3/TYPESETTING_NORMALISATIONS.md"

          for D in "$P2" "$P3"; do
            (cd "$D" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          done
          cp -r "$P2" "$DIST/combined_release/paper2_release"
          cp -r "$P3" "$DIST/combined_release/paper3_release"
          (cd "$DIST/combined_release" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$DIST" && zip -r -9 Paper_II_release.zip paper2_release && zip -r -9 Paper_III_release.zip paper3_release && zip -r -9 Papers_II_III_combined_release.zip combined_release)
          (cd "$DIST" && sha256sum Paper_II_release.zip Paper_III_release.zip Papers_II_III_combined_release.zip > RELEASE_ZIP_SHA256SUMS.txt)

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papers2-3-release
          path: publications/fortune-papers-ii-vi-20260724/papers2-3-dist/
          if-no-files-found: error
          retention-days: 30
