name: Build Papers II and III release artifacts

on:
  pull_request:
    branches:
      - gpt56/d1-gate-bridge-terminal-20260724
    paths:
      - .github/workflows/build-papers2-3-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1784900000"
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4866d113898a48f23feb9752576c350af97c6985
          fetch-depth: 0

      - name: Install fixed document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended poppler-utils zip python3-docx libreoffice-writer

      - name: Fetch and run canonical build script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt56/d1-gate-bridge-terminal-20260724
          git show origin/gpt56/d1-gate-bridge-terminal-20260724:scripts/build_papers2_3_release.sh > /tmp/build_papers2_3_release.sh
          chmod +x /tmp/build_papers2_3_release.sh
          /tmp/build_papers2_3_release.sh

      - name: Upload canonical release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papers2-3-canonical-release
          path: publications/fortune-papers-ii-vi-20260724/papers2-3-dist/
          if-no-files-found: error
          retention-days: 30
