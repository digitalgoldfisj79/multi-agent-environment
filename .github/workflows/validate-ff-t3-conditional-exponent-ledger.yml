name: Validate FF T3 conditional exponent ledger

on:
  push:
    branches:
      - gpt56/fortune-mesoscopic-cotlar-20260728
    paths:
      - "frontier/integer_source_frame_bridge/FF_T3_COSET_INTAKE_AND_CORRECTED_CONDITIONAL_BOUNDARY_20260730.md"
      - "frontier/integer_source_frame_bridge/ff_t3_conditional_exponent_ledger_verify.py"
      - "frontier/integer_source_frame_bridge/ff_t3_conditional_exponent_ledger_results.json"
      - ".github/workflows/validate-ff-t3-conditional-exponent-ledger.yml"
  pull_request:
    paths:
      - "frontier/integer_source_frame_bridge/FF_T3_COSET_INTAKE_AND_CORRECTED_CONDITIONAL_BOUNDARY_20260730.md"
      - "frontier/integer_source_frame_bridge/ff_t3_conditional_exponent_ledger_verify.py"
      - "frontier/integer_source_frame_bridge/ff_t3_conditional_exponent_ledger_results.json"
      - ".github/workflows/validate-ff-t3-conditional-exponent-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact exponent ledger verifier
        run: python frontier/integer_source_frame_bridge/ff_t3_conditional_exponent_ledger_verify.py
      - name: Require frozen result match
        run: git diff --exit-code -- frontier/integer_source_frame_bridge/ff_t3_conditional_exponent_ledger_results.json
