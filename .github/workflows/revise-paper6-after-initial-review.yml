              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          wc -l -c publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md
          sha256sum publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md
      - name: Commit amended source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement/manuscript.md
