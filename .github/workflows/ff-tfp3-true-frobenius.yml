name: Validate TFP3 true-Frobenius harness

on:
  push:
    branches:
      - gpt56/fortune-tfp3-true-frobenius-20260731
      - gpt56/fortune-monodromy-trace-transfer-20260731
    paths:
      - fortune-review/scripts/ff_tfp3_*.py
      - fortune-review/scripts/ff_large_field_cubic_falsification.cpp
      - fortune-review/data/ff_tfp3_*.json
      - fortune-review/TFP3_*.md
      - .github/workflows/ff-tfp3-true-frobenius.yml
  pull_request:
    paths:
      - fortune-review/scripts/ff_tfp3_*.py
      - fortune-review/scripts/ff_large_field_cubic_falsification.cpp
      - fortune-review/data/ff_tfp3_*.json
      - fortune-review/TFP3_*.md
      - .github/workflows/ff-tfp3-true-frobenius.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tfp3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  true-orientation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic audit dependency
        run: python3 -m pip install --quiet sympy
      - name: Audit orientation identity and corrected sign torsors
        run: python3 fortune-review/scripts/ff_tfp3_sign_cover_audit.py
      - name: Audit rho=1 nonzero-defect records
        run: PYTHONPATH=fortune-review/scripts python3 fortune-review/scripts/ff_tfp3_rho_one_defect_audit.py
      - name: Build exact classifier
        run: |
          set -euo pipefail
          python3 fortune-review/scripts/ff_tfp3_build_classifier.py /tmp/tfp3.cpp
          g++ -O3 -std=c++20 /tmp/tfp3.cpp -o /tmp/tfp3
      - name: Reproduce frozen panel
        run: |
          set -euo pipefail
          /tmp/tfp3 --regression > /tmp/tfp3-regression.jsonl
          python3 fortune-review/scripts/ff_tfp3_orientation_verify.py /tmp/tfp3-regression.jsonl
      - name: Reproduce extended sentinels including rho=1
        run: |
          set -euo pipefail
          /tmp/tfp3 61 67 71 97 > /tmp/tfp3-extended.jsonl
          python3 fortune-review/scripts/ff_tfp3_orientation_verify.py /tmp/tfp3-extended.jsonl
          python3 - <<'PY'
          import json
          expected={61:(6,21960),67:(12,53064),71:(10,49700),97:(16,148992)}
          got={}; rho_one=0
          for line in open('/tmp/tfp3-extended.jsonl'):
              row=json.loads(line)
              if row['type']=='summary': got[row['q']]=(row['true_orbits'],row['incidences'])
              elif row['type']=='orbit' and row['q']==97 and row['rho']==1: rho_one+=1
          assert got==expected,(got,expected)
          assert rho_one==2,rho_one
          PY
      - name: Audit committed panel
        run: |
          python3 fortune-review/scripts/ff_tfp3_panel_analyse.py \
            fortune-review/data/ff_tfp3_true_panel_through_101.json
