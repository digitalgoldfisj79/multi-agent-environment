name: Build Paper IV release artifacts

on:
  pull_request:
    branches:
      - gpt56/d1-gate-bridge-terminal-20260724
    paths:
      - .github/workflows/build-paper4-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-papers-2-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/fortune-papers-ii-vi-20260724
          fetch-depth: 0
      - name: Fetch frozen sources
        run: |
          git fetch origin archive/fortune-paper2-20260720
          git fetch origin claude/experimental-branch-review-am0zpg
      - name: Rebuild manuscripts
        run: python3 scripts/rebuild_papers2_3.py
      - name: Validate source integrity
        run: |
          set -euo pipefail
          P2=publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
          P3=publications/fortune-papers-ii-vi-20260724/paper3_pair_sum/manuscript.md
          test -s "$P2" && test -s "$P3"
          ! grep -nE 'TODO|TBD|PLACEHOLDER|\\x00' "$P2" "$P3"
          grep -Fq 'The exact equivalence of these two open targets is not asserted' "$P2"
          grep -Fq 'Appendix A. Complete kernel-theory proof' "$P3"
          grep -Fq 'Appendix C. Corrected conditional Hardy--Littlewood theorem' "$P3"
          wc -l -c "$P2" "$P3"
          sha256sum "$P2" "$P3"
      - name: Commit reconstructed manuscripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md publications/fortune-papers-ii-vi-20260724/paper2_revised/references.bib publications/fortune-papers-ii-vi-20260724/paper3_pair_sum/manuscript.md publications/fortune-papers-ii-vi-20260724/PAPERS_II_III_FROZEN_SOURCE_MANIFEST.tsv
          git commit -m 'Rebuild Papers II and III from frozen proof sources'
          git push origin HEAD:publication/fortune-papers-ii-vi-20260724
      - name: Upload reconstructed manuscripts
        uses: actions/upload-artifact@v4
        with:
          name: papers2-3-reconstructed-sources
          path: |
            publications/fortune-papers-ii-vi-20260724/paper2_revised/manuscript.md
            publications/fortune-papers-ii-vi-20260724/paper3_pair_sum/manuscript.md
            publications/fortune-papers-ii-vi-20260724/PAPERS_II_III_FROZEN_SOURCE_MANIFEST.tsv
          retention-days: 30
