name: Fortune INT-SOCG stratified cumulants

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fortune-int-socg-stratified-cumulants/**'
      - 'fortune-formal/FortuneFormal/Integer/AdaptiveOccupancyCriterion.lean'
      - 'fortune-formal/FortuneFormal.lean'
      - '.github/workflows/fortune-int-socg-stratified-cumulants.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static and exact regression audit
        run: python fortune-int-socg-stratified-cumulants/scripts/verify_programme.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: fortune-formal
          build: true
