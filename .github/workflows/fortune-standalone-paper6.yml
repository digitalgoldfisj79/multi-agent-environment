name: Fortune standalone Paper VI

on:
  push:
    branches:
      - gpt56/fortune-standalone-papers-v1-20260811
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortune-standalone-paper6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-paper6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone Paper VI
        run: |
          python -m py_compile fortune-standalone-rebuild/scripts/build_paper6.py
          python fortune-standalone-rebuild/scripts/build_paper6.py
      - name: Standalone dependency and theorem audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          d = Path('publications/fortune-standalone-20260811/paper6_secondary_traces_quotients')
          out = (d/'manuscript.md').read_text()
          manifest = json.loads((d/'SOURCE_MANIFEST.json').read_text())
          status = (d/'CLAIM_STATUS.md').read_text()
          referee = (d/'REFEREE_READ.md').read_text()
          forbidden = ['Paper V','preceding paper','six-paper sequence','this series','BozzardPaperV','D1-QLINE-NONSAT']
          assert not [x for x in forbidden if x in out]
          labels = re.findall(r'^## (Proposition|Theorem|Corollary) ([0-9]+\.[0-9]+)', out, re.M)
          assert len(labels) == 16, labels
          assert manifest['statement_count'] == 16
          assert manifest['logical_cross_paper_dependencies'] == 0
          assert manifest['universal_crown_proved'] is False
          assert manifest['integer_transfer_proved'] is False
          assert 'Theorem 11.2 multiplied by' not in out
          assert 'exactly the second formula of Theorem 11.2' in out
          assert 'Kummer-quotient nonvanishing problem' in out
          assert 'No theorem in this paper proves Fortune\'s conjecture over the integers.' in out
          assert 'PASS_AFTER_DEPENDENCY_CLOSURE' in referee
          assert 'N_sq + N_ns > 0' in status
          assert 'TODO' not in out and 'TBD' not in out
          print(f'STANDALONE_PAPER6_AUDIT_PASS statements={len(labels)} bytes={len(out)}')
          PY
      - name: Re-run independent algebraic reconstruction
        working-directory: publications/fortune-papers-ii-vi-20260724/paper6_secondary_quotients_replacement
        run: |
          cp paper6_independent_reconstruction_results.json /tmp/p6_expected.json
          python paper6_independent_reconstruction.py >/tmp/p6_reconstruction.txt
          python - <<'PY'
          import json
          assert json.load(open('/tmp/p6_expected.json')) == json.load(open('paper6_independent_reconstruction_results.json'))
          print('PAPER6_INDEPENDENT_RECONSTRUCTION_MATCH')
          PY
      - name: Diff hygiene
        run: git diff --check
      - name: Persist standalone Paper VI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/fortune-standalone-20260811/paper6_secondary_traces_quotients
          if git diff --cached --quiet; then
            echo NO_GENERATED_CHANGES
          else
            git commit -m 'fortune standalone: rebuild Paper VI [skip ci]'
            git push origin HEAD:gpt56/fortune-standalone-papers-v1-20260811
          fi
